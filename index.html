<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" /><meta name="theme-color" content="#e8f0ea" /><title>北巷咖啡</title><link rel="icon" href="/favicon.ico" type="image/x-icon" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" /><style> :root { --mist: #e8f0ea; --leaf: #3d6b52; --leaf-deep: #244233; --ink: #1c2420; --soft: #5a6b62; --paper: rgba(255, 255, 255, 0.62); --line: rgba(61, 107, 82, 0.18); --peach: #f3d9c4; } * { box-sizing: border-box; } html, body { margin: 0; min-height: 100%; min-height: 100dvh; color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(1100px 520px at 12% -10%, rgba(243, 217, 196, 0.55), transparent 58%), radial-gradient(900px 480px at 100% 20%, rgba(61, 107, 82, 0.14), transparent 52%), linear-gradient(165deg, #f7fbf8 0%, var(--mist) 48%, #dde8e1 100%); background-attachment: fixed; } body { min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; } .glow { pointer-events: none; position: fixed; inset: auto -8% -18% auto; width: min(520px, 78vw); height: min(520px, 78vw); border-radius: 50%; background: radial-gradient(circle, rgba(243, 217, 196, 0.45), transparent 68%); filter: blur(8px); animation: breathe 9s ease-in-out infinite alternate; z-index: 0; } .leaf-blob { pointer-events: none; position: fixed; left: -12%; top: 28%; width: min(420px, 70vw); height: min(420px, 70vw); border-radius: 46% 54% 38% 62%; background: radial-gradient(circle at 40% 40%, rgba(61, 107, 82, 0.16), transparent 70%); animation: drift 12s ease-in-out infinite alternate; z-index: 0; } .top { position: relative; z-index: 1; width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: clamp(28px, 5vh, 48px) 0 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; opacity: 0; animation: rise 0.8s ease forwards 0.05s; } .mark { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--leaf); font-weight: 500; } .hours-pill { font-size: 12px; color: var(--soft); border: 1px solid var(--line); background: var(--paper); padding: 8px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); } .hero { position: relative; z-index: 1; width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: clamp(40px, 10vh, 96px) 0 clamp(36px, 8vh, 72px); flex: 1; display: grid; align-content: center; gap: clamp(28px, 5vh, 48px); } .hero-copy h1 { font-family: "Fraunces", "Noto Serif SC", serif; font-weight: 650; font-size: clamp(52px, 12vw, 104px); line-height: 0.92; letter-spacing: -0.02em; margin: 0 0 14px; color: var(--leaf-deep); opacity: 0; animation: rise 0.95s ease forwards 0.16s; } .hero-copy h1 span { display: block; font-weight: 500; font-style: italic; color: var(--leaf); } .hero-cn { margin: 0 0 18px; font-size: 16px; letter-spacing: 0.48em; color: var(--soft); opacity: 0; animation: rise 0.95s ease forwards 0.28s; } .hero-lead { margin: 0; max-width: 34em; font-size: clamp(15px, 2.2vw, 17px); line-height: 1.75; color: var(--soft); opacity: 0; animation: rise 0.95s ease forwards 0.4s; } .panel { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; opacity: 0; animation: rise 0.95s ease forwards 0.55s; } @media (max-width: 760px) { .panel { grid-template-columns: 1fr; } .hours-pill { display: none; } } .card { border: 1px solid var(--line); background: var(--paper); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 22px 22px 20px; } .card h2 { margin: 0 0 14px; font-family: "Fraunces", serif; font-size: 22px; font-weight: 500; font-style: italic; color: var(--leaf-deep); } .rows { display: grid; gap: 11px; } .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; font-size: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); } .row:last-child { border-bottom: 0; padding-bottom: 0; } .row b { font-weight: 500; color: var(--ink); } .row i { font-style: normal; color: var(--soft); font-size: 12px; margin-left: 8px; } .row em { font-style: normal; color: var(--leaf); letter-spacing: 0.03em; } .note { font-size: 14px; line-height: 1.75; color: var(--soft); margin: 0; } .note strong { display: block; color: var(--leaf-deep); font-weight: 500; margin-bottom: 6px; } .foot { position: relative; z-index: 1; width: min(920px, calc(100% - 40px)); margin: 0 auto 28px; font-size: 12px; color: var(--soft); letter-spacing: 0.08em; opacity: 0; animation: rise 0.8s ease forwards 0.7s; } @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } @keyframes breathe { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-2%, -3%, 0) scale(1.06); } } @keyframes drift { from { transform: translate3d(0, 0, 0) rotate(0deg); } to { transform: translate3d(3%, 2%, 0) rotate(4deg); } } </style></head><body><div class="glow" aria-hidden="true"></div><div class="leaf-blob" aria-hidden="true"></div><header class="top"><div class="mark">North Lane Cafe</div><div class="hours-pill">每日 08:30 — 22:00</div></header><main class="hero"><div class="hero-copy"><h1>North <span>Lane</span></h1><p class="hero-cn">北巷咖啡</p><p class="hero-lead">晨光落进巷口的玻璃窗。浅焙豆子现磨，靠窗有位子，适合慢慢开始一天。</p></div><div class="panel"><section class="card"><h2>Morning board</h2><div class="rows"><div class="row"><b>燕麦拿铁 <i>Oat Latte</i></b><em>¥30</em></div><div class="row"><b>生椰冷萃 <i>Coco Cold Brew</i></b><em>¥28</em></div><div class="row"><b>瑰夏滤杯 <i>Geisha Filter</i></b><em>¥48</em></div><div class="row"><b>肉桂卡布 <i>Cinnamon Cappuccino</i></b><em>¥31</em></div></div></section><section class="card"><
