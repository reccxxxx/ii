<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" /><meta name="theme-color" content="#2a1f18" /><title>北巷咖啡</title><link rel="icon" href="/favicon.ico" type="image/x-icon" /><style> :root { --cream: #f3e6d4; --foam: #efe0cc; --mute: #c4b09a; --wood: #8b5e3c; --bean: #3a2a20; --deep: #1a1410; --steam: rgba(243, 230, 212, 0.12); } * { box-sizing: border-box; } html, body { margin: 0; min-height: 100%; min-height: 100dvh; color: var(--cream); font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; background: radial-gradient(900px 480px at 80% -5%, rgba(139, 94, 60, 0.28), transparent 55%), radial-gradient(700px 420px at 0% 90%, rgba(90, 58, 40, 0.35), transparent 50%), linear-gradient(160deg, #120e0b 0%, var(--deep) 42%, #241910 100%); background-attachment: fixed; } body { min-height: 100dvh; display: flex; flex-direction: column; } .steam { pointer-events: none; position: fixed; inset: 0; z-index: 0; background: radial-gradient(circle at 30% 70%, var(--steam), transparent 28%), radial-gradient(circle at 62% 55%, rgba(243, 230, 212, 0.08), transparent 22%); animation: drift 10s ease-in-out infinite alternate; } .shell { position: relative; z-index: 1; width: min(680px, calc(100% - 36px)); margin: 0 auto; padding: clamp(56px, 14vh, 130px) 0 72px; flex: 1; display: flex; flex-direction: column; justify-content: center; } .eyebrow { font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--wood); margin: 0 0 18px; opacity: 0; animation: up 0.9s ease forwards 0.05s; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .brand { font-size: clamp(48px, 11vw, 78px); font-weight: 600; line-height: 0.95; letter-spacing: 0.04em; margin: 0 0 10px; opacity: 0; animation: up 0.9s ease forwards 0.15s; } .brand em { font-style: italic; font-weight: 500; color: var(--foam); } .cn { font-size: 15px; letter-spacing: 0.42em; color: var(--mute); margin: 0 0 34px; opacity: 0; animation: up 0.9s ease forwards 0.28s; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .card { border: 1px solid rgba(243, 230, 212, 0.14); background: rgba(26, 20, 16, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 28px 22px 24px; text-align: center; opacity: 0; animation: up 0.9s ease forwards 0.42s; } .cup { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; border: 1px solid rgba(243, 230, 212, 0.22); display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: 0.12em; color: var(--wood); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .status { margin: 0 0 10px; font-size: 22px; font-weight: 600; letter-spacing: 0.18em; color: var(--cream); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .hint { margin: 0 0 20px; font-size: 14px; line-height: 1.7; color: var(--mute); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .hours { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; font-size: 13px; line-height: 1.6; text-align: left; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .hours span:nth-child(odd) { color: var(--mute); } .hours span:nth-child(even) { color: var(--cream); text-align: right; } .addr { margin-top: 28px; font-size: 13px; color: var(--mute); line-height: 1.7; opacity: 0; animation: up 0.9s ease forwards 0.58s; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; } .addr strong { display: block; color: var(--cream); font-weight: 500; margin-bottom: 4px; } @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } } @keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-1.5%, -1%, 0) scale(1.04); } } </style></head><body><div class="steam" aria-hidden="true"></div><main class="shell"><p class="eyebrow">Est. Quiet Corner</p><h1 class="brand">North <em>Lane</em></h1><p class="cn">北巷咖啡</p><section class="card"><div class="cup" aria-hidden="true">NL</div><p class="status">PDF不见了😊</p><p class="hint">这份手冲暂时取不到，请稍后再试或换一份单。</p><div class="hours"><span>周一至周五</span><span>08:30 — 21:00</span><span>周末与节假日</span><span>09:00 — 22:00</span></div></section><p class="addr"><strong>欢迎坐到靠窗的位子</strong> 浅焙豆子每天现磨。店内可阅读，外带请提醒少冰。 </p></main></body></html>
